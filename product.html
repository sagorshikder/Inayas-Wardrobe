<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#b8732e">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Inaya's Wardrobe">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="Product Details | Inaya's Wardrobe">
<meta property="og:description" content="Product details, price and options for furniture and wardrobes from Inaya's Wardrobe, Bangladesh.">
<meta property="og:url" content="https://inayaswardrobe.com/product.html">

<link rel="stylesheet" href="style.css?v=5"><link rel="stylesheet" href="pages.css?v=5"><link rel="stylesheet" href="theme.css?v=5"><script src="theme.js?v=5"></script>
<style>
.pd-gal{min-width:0}
.pd-gal .pd-img{position:relative}
.pd-gal .pd-img img{object-fit:contain}
.pd-thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pd-thumb{width:72px;height:72px;padding:0;border:2px solid #e2d3c1;border-radius:10px;overflow:hidden;cursor:pointer;background:#fff;opacity:.75;transition:.2s}
.pd-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pd-thumb:hover{opacity:1}
.pd-thumb.on{border-color:#b8732e;opacity:1}
.pd-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:#2f2018;font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:2}
.pd-nav.prev{left:10px}.pd-nav.next{right:10px}
.pd-nav:hover{background:#fff}
.pd-count{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 10px;border-radius:999px;z-index:2}
html[data-theme="dark"] .pd-thumb{border-color:#4a3a2d;background:#2d221a}
html[data-theme="dark"] .pd-thumb.on{border-color:#d08a45}
html[data-theme="dark"] .pd-nav{background:rgba(36,26,20,.9);color:#f1e6d8}
</style>
</head><body>
<div id="site-header"></div>
<main class="page"><div class="wrap" id="detail"></div>
  <div class="wrap" style="margin-top:56px"><h2 class="sec-title">You may also like</h2><div class="product-grid" id="related"></div></div></main>
<div id="site-footer"></div>
<script src="Admin-Panel/firebase-config.js"></script><script src="products.js?v=5"></script><script src="layout.js?v=5"></script>
<script>
(async function(){
  await loadAdminProducts();
  const id = new URLSearchParams(location.search).get("id");
  const p = PRODUCTS.find(x => x.id === id);
  const box = document.getElementById("detail");
  if (!p) { box.innerHTML = '<p>Product not found. <a href="shop.html">Back to shop</a></p>'; return; }
  document.title = p.name + " | Inaya's Wardrobe";
  const colors = ["Walnut Brown","Natural Oak","Matte White","Charcoal Grey"];
  const gallery = (p.imgs && p.imgs.length) ? p.imgs.filter(Boolean) : [p.img];
  box.innerHTML = `
  <div class="pd">
    <div class="pd-gal">
      <div class="pd-img"><img id="pMain" src="${p.img}" alt="${p.name}">${gallery.length>1?'<button type="button" class="pd-nav prev" aria-label="Previous photo">&#8249;</button><button type="button" class="pd-nav next" aria-label="Next photo">&#8250;</button><span class="pd-count" id="pCount"></span>':""}</div>
      ${gallery.length>1?'<div class="pd-thumbs">'+gallery.map((src,i)=>'<button type="button" class="pd-thumb'+(i===0?' on':'')+'" data-i="'+i+'" aria-label="Photo '+(i+1)+'"><img src="'+src+'" alt=""></button>').join("")+'</div>':""}
    </div>
    <div>
      <span class="product-cat">${p.cat}</span><h1>${p.name}</h1>
      <div class="price"><span class="now">${fmt(p.price)}</span>${p.old?`<span class="old">${fmt(p.old)}</span>`:""}</div>
      <p style="color:#4a3a2e;line-height:1.7">${p.desc}</p>
      <label style="display:grid;gap:6px;font-weight:600;max-width:260px">Color
        <select id="pcolor" style="padding:11px;border:1px solid #d9c6ad;border-radius:10px">${colors.map(c=>`<option>${c}</option>`).join("")}</select></label>
      <div class="pd-row">
        <button class="btn add-cart" id="pAdd" data-id="${p.id}" data-name="${p.name}" data-price="${p.price}">কার্টে যোগ করুন</button>
        <button class="btn order-now" id="pOrder" data-id="${p.id}" data-name="${p.name}" data-price="${p.price}">অর্ডার করুন</button>
        <a class="btn outline" id="pWa" target="_blank" rel="noopener" href="#">WhatsApp-এ জিজ্ঞাসা করুন</a>
        <button class="wish-btn" style="position:static" data-id="${p.id}" aria-label="Wishlist">♡</button>
      </div>
      <p style="color:#6b5a4d;margin-top:18px">Free measuring visit for custom size. Delivery and installation available.</p>
    </div>
  </div>`;
  let cur = 0;
  const mainImg = document.getElementById("pMain"), thumbs = [...box.querySelectorAll(".pd-thumb")], cnt = document.getElementById("pCount");
  function showPhoto(i){
    cur = (i + gallery.length) % gallery.length;
    mainImg.src = gallery[cur];
    thumbs.forEach((t,k) => t.classList.toggle("on", k === cur));
    if (cnt) cnt.textContent = (cur + 1) + " / " + gallery.length;
  }
  thumbs.forEach(t => t.addEventListener("click", () => showPhoto(+t.dataset.i)));
  const pv = box.querySelector(".pd-nav.prev"), nx = box.querySelector(".pd-nav.next");
  if (pv) pv.addEventListener("click", () => showPhoto(cur - 1));
  if (nx) nx.addEventListener("click", () => showPhoto(cur + 1));
  if (gallery.length > 1) {
    showPhoto(0);
    document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") showPhoto(cur - 1); if (e.key === "ArrowRight") showPhoto(cur + 1); });
    let x0 = null; const area = box.querySelector(".pd-img");
    area.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
    area.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) showPhoto(cur + (dx < 0 ? 1 : -1)); x0 = null; });
  }
  const sel = document.getElementById("pcolor"), add = document.getElementById("pAdd"), wa = document.getElementById("pWa");
  function sync(){
    const c = sel.value;
    add.dataset.id = p.id + "-" + c.replace(/\s/g,"");
    add.dataset.name = p.name + " (" + c + ")";
    const ord = document.getElementById("pOrder"); ord.dataset.id = add.dataset.id; ord.dataset.name = add.dataset.name;
    wa.href = "https://wa.me/8801714000349?text=" + encodeURIComponent(`Hello, I am interested in ${p.name} (${c}), price ${fmt(p.price)}.`);
  }
  sel.addEventListener("change", sync); sync();
  document.getElementById("related").innerHTML = PRODUCTS.filter(x => x.cat===p.cat && x.id!==p.id).concat(PRODUCTS.filter(x=>x.cat!==p.cat && x.id!==p.id)).slice(0,4).map(cardHTML).join("");
  if (window.initWish) initWish();
})();
</script>
<script src="main.js?v=5"></script></body></html>
