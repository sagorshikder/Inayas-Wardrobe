<div id="site-header"></div>
<section class="page-hero"><div class="wrap"><h1>Our Gallery</h1><p>Projects we have completed for our customers.</p></div></section>
<main class="page"><div class="wrap">
  <div class="shop-top" id="gf"></div>
  <div class="gal-grid" id="gg"></div>
</div></main>
<div class="lightbox" id="lb"><img alt="Preview"></div>
<div id="site-footer"></div>
<script src="products.js?v=5"></script><script src="layout.js?v=5"></script>
<script>
(function(){
  /* Nijer photo: images/gallery-1.jpg ... gallery-8.jpg */
  const G = [["Wardrobe",1],["Bedroom",2],["Living Room",3],["Dining",4],["Wardrobe",5],["Bedroom",6],["Living Room",7],["Dining",8]];
  const cats = ["All","Wardrobe","Bedroom","Living Room","Dining"];
  const gf = document.getElementById("gf"), gg = document.getElementById("gg"), lb = document.getElementById("lb");
  function draw(c){
    gf.innerHTML = cats.map(x => `<button class="chip ${x===c?"on":""}" style="width:auto;display:inline-block" data-c="${x}">${x}</button>`).join("");
    gg.innerHTML = G.filter(g => c==="All"||g[0]===c).map(g => `<img src="images/gallery-${g[1]}.jpg" alt="${g[0]} project" loading="lazy">`).join("");
  }
  gf.addEventListener("click", e => e.target.dataset.c && draw(e.target.dataset.c));
  gg.addEventListener("click", e => { if (e.target.tagName==="IMG") { lb.firstElementChild.src = e.target.src; lb.classList.add("on"); } });
  lb.addEventListener("click", () => lb.classList.remove("on"));
  draw("All");
})();
</script>
<script src="main.js?v=5"></script></body></html>
