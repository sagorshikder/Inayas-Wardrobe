</head><body>
<div id="site-header"></div>
<section class="page-hero"><div class="wrap"><h1 id="shopTitle">Shop</h1><p>Find the right piece for your home.</p></div></section>
<main class="page"><div class="wrap shop">
  <aside class="filters">
    <h4>Category</h4><div id="cats"></div>
    <h4 style="margin-top:18px">Max price: <span id="pv"></span></h4>
    <input type="range" id="price" min="5000" max="60000" step="1000" value="60000">
  </aside>
  <section>
    <div class="shop-top"><span id="count"></span>
      <select id="sort"><option value="">Sort: Featured</option><option value="lo">Price: Low to High</option><option value="hi">Price: High to Low</option></select>
    </div>
    <div class="product-grid" id="grid"></div>
  </section>
</div></main>
<div id="site-footer"></div>
<script src="Admin-Panel/firebase-config.js"></script><script src="products.js?v=5"></script><script src="layout.js?v=5"></script>
<script>
(async function(){
  await loadAdminProducts();
  const P = new URLSearchParams(location.search);
  let cat = P.get("cat") || "All", q = (P.get("q") || "").toLowerCase();
  const wishMode = P.get("wish") === "1";
  const wl = () => { try { return JSON.parse(localStorage.getItem("wish")) || []; } catch (e) { return []; } };
  const cats = ["All", ...new Set(PRODUCTS.map(p => p.cat))];
  const $ = id => document.getElementById(id);
  const mx = Math.max(60000, ...PRODUCTS.map(p => p.price)); $("price").max = mx; $("price").value = mx;
  function draw(){
    $("cats").innerHTML = cats.map(c => `<button class="chip ${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
    const max = +$("price").value; $("pv").textContent = fmt(max);
    let list = PRODUCTS.filter(p => (cat==="All"||p.cat===cat) && p.price<=max && (!q || (p.name+p.cat).toLowerCase().includes(q)) && (!wishMode || wl().includes(p.id)));
    if ($("sort").value==="lo") list.sort((a,b)=>a.price-b.price);
    if ($("sort").value==="hi") list.sort((a,b)=>b.price-a.price);
    $("count").textContent = list.length + " products";
    $("shopTitle").textContent = wishMode ? "My Wishlist" : (cat==="All" ? "Shop" : cat);
    $("grid").innerHTML = list.length ? list.map(cardHTML).join("") : (wishMode ? "<p>আপনার wishlist এখনো খালি। যেকোনো পণ্যের ♡ চাপুন।</p>" : "<p>No products found. Try another filter.</p>");
    if (window.initWish) initWish();
  }
  $("grid").addEventListener("click", e => { if (wishMode && e.target.closest(".wish-btn")) setTimeout(draw, 80); });
  $("cats").addEventListener("click", e => { if (e.target.dataset.c) { cat = e.target.dataset.c; draw(); } });
  $("price").addEventListener("input", draw); $("sort").addEventListener("change", draw);
  draw();
})();
</script>
<script src="main.js?v=5"></script></body></html>
