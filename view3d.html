</head><body>
<div id="site-header"></div>
<section class="page-hero"><div class="wrap"><h1>3D Wardrobe View</h1><p>Drag to rotate, scroll to zoom. Change size and color, then send your design to us.</p></div></section>
<main class="page"><div class="wrap v3">
  <div id="stage"></div>
  <aside class="panel">
    <label>Width: <span id="wv">6</span> ft<input type="range" id="sw" min="3" max="10" step="0.5" value="6"></label>
    <label>Height: <span id="hv">7</span> ft<input type="range" id="sh" min="5" max="9" step="0.5" value="7"></label>
    <div><b>Color</b><div class="swatches" style="margin-top:8px" id="sws"></div></div>
    <button class="btn outline" id="door">Open / Close doors</button>
    <a class="btn" id="send" target="_blank" rel="noopener" href="#">Send this design on WhatsApp</a>
  </aside>
</div></main>
<div id="site-footer"></div>
<script src="products.js?v=5"></script><script src="layout.js?v=5"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const stage = document.getElementById("stage");
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf3eadf);
  const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 100); cam.position.set(0, 1, 8);
  const rend = new THREE.WebGLRenderer({ antialias: true });
  rend.setPixelRatio(Math.min(devicePixelRatio, 2)); stage.appendChild(rend.domElement);
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(4, 6, 6); scene.add(sun);

  const floor = new THREE.Mesh(new THREE.CircleGeometry(5, 48), new THREE.MeshStandardMaterial({ color: 0xe0d0bb }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -1.5; scene.add(floor);

  const mat = new THREE.MeshStandardMaterial({ color: 0x6b4a32, roughness: 0.6 });
  const gold = new THREE.MeshStandardMaterial({ color: 0xc9a24a, metalness: 0.7, roughness: 0.3 });
  const g = new THREE.Group(); scene.add(g);
  let doors = [], open = false, auto = true;
  const $ = id => document.getElementById(id);

  function build() {
    while (g.children.length) g.remove(g.children[0]);
    doors = [];
    const W = +$("sw").value * 0.5, H = +$("sh").value * 0.5, D = 1, t = 0.06, y0 = -1.5;
    $("wv").textContent = $("sw").value; $("hv").textContent = $("sh").value;
    const box = (w, h, d, x, y, z, m) => {
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m || mat); b.position.set(x, y, z); g.add(b); return b;
    };
    box(t, H, D, -W / 2 + t / 2, y0 + H / 2, 0);
    box(t, H, D, W / 2 - t / 2, y0 + H / 2, 0);
    box(W, t, D, 0, y0 + H - t / 2, 0);
    box(W, t, D, 0, y0 + t / 2, 0);
    box(W, H, t, 0, y0 + H / 2, -D / 2 + t / 2);
    for (let i = 1; i <= 3; i++) box(W / 2 - t, t, D - 0.1, -W / 4, y0 + H * i / 4, 0);
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, W / 2 - t, 12), gold);
    rod.rotation.z = Math.PI / 2; rod.position.set(W / 4, y0 + H * 0.82, 0); g.add(rod);
    [-1, 1].forEach(side => {
      const pivot = new THREE.Group(); pivot.position.set(side * W / 2, y0 + H / 2, D / 2 + 0.02);
      const door = new THREE.Mesh(new THREE.BoxGeometry(W / 2 - 0.01, H - 0.04, t), mat); door.position.x = -side * W / 4;
      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.4, 0.05), gold); handle.position.set(-side * (W / 2 - 0.15), 0, 0.05);
      pivot.add(door, handle); g.add(pivot); doors.push({ pivot, side });
    });
    $("send").href = "https://wa.me/8801714000349?text=" + encodeURIComponent(
      `Hello, I want a custom wardrobe.\nSize: ${$("sw").value} ft wide x ${$("sh").value} ft high\nColor: ${color}`);
  }

  let color = "Walnut Brown";
  const colors = [["Walnut Brown", 0x6b4a32], ["Natural Oak", 0xc49a62], ["Matte White", 0xf1ede6], ["Charcoal Grey", 0x45484d]];
  $("sws").innerHTML = colors.map(([n, h], i) => `<div class="sw" title="${n}" data-i="${i}" style="background:#${h.toString(16).padStart(6, "0")}"></div>`).join("");
  $("sws").addEventListener("click", e => {
    if (e.target.dataset.i === undefined) return;
    const [n, h] = colors[e.target.dataset.i]; mat.color.set(h); color = n; build();
  });
  $("sw").addEventListener("input", build); $("sh").addEventListener("input", build);
  $("door").addEventListener("click", () => open = !open);

  /* drag to rotate, wheel to zoom */
  let drag = false, lx = 0;
  rend.domElement.addEventListener("pointerdown", e => { drag = true; auto = false; lx = e.clientX; });
  addEventListener("pointerup", () => drag = false);
  addEventListener("pointermove", e => { if (drag) { g.rotation.y += (e.clientX - lx) * 0.01; lx = e.clientX; } });
  rend.domElement.addEventListener("wheel", e => { e.preventDefault(); cam.position.z = Math.min(14, Math.max(4, cam.position.z + e.deltaY * 0.01)); }, { passive: false });

  function resize() { const w = stage.clientWidth, h = stage.clientHeight; rend.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  addEventListener("resize", resize); resize(); build();

  (function loop() {
    requestAnimationFrame(loop);
    if (auto) g.rotation.y += 0.004;
    doors.forEach(d => { const target = open ? d.side * 1.7 : 0; d.pivot.rotation.y += (target - d.pivot.rotation.y) * 0.1; });
    cam.lookAt(0, 0, 0); rend.render(scene, cam);
  })();
})();
</script>
<script src="main.js?v=5"></script></body></html>
